name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */12 * * *"   # every 12 hours
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Visit app (wake it if asleep)
        env:
          APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Set the repository variable STREAMLIT_APP_URL"
            exit 1
          fi
          python scripts/keep_alive.py "$APP_URL"
